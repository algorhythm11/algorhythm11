name: Generate Trophies

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch:        # manual trigger from Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download trophy image
        run: |
          curl -s "https://github-profile-trophy.vercel.app/?username=algorhythm11&theme=onedark&no-frame=true&row=1&column=7" -o trophies.svg

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trophies.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "Update trophies.svg"
          git push
