name: Generate Trophies

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch:        # manual trigger from Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download trophy image (tries multiple mirrors, never fails the build)
        run: |
          URLS=(
            "https://github-profile-trophy.vercel.app/?username=algorhythm11&theme=onedark&no-frame=true&row=1&column=7"
            "https://github-profile-trophy-liard-delta.vercel.app/?username=algorhythm11&theme=onedark&no-frame=true&row=1&column=7"
            "https://github-profile-trophy-fork-two.vercel.app/?username=algorhythm11&theme=onedark&no-frame=true&row=1&column=7"
            "https://github-profile-trophy-winning.vercel.app/?username=algorhythm11&theme=onedark&no-frame=true&row=1&column=7"
            "https://github-profile-trophy-kannan.vercel.app/?username=algorhythm11&theme=onedark&no-frame=true&row=1&column=7"
          )

          SUCCESS=false

          for url in "${URLS[@]}"; do
            echo "Trying: $url"
            curl -sSL -f "$url" -o trophies_tmp.svg || true

            if [ -s trophies_tmp.svg ] && head -c 200 trophies_tmp.svg | grep -q "<svg"; then
              echo "Valid SVG received from $url"
              mv trophies_tmp.svg trophies.svg
              SUCCESS=true
              break
            else
              echo "Failed or invalid response from this mirror, trying next..."
              rm -f trophies_tmp.svg
              sleep 5
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "::warning::All trophy mirrors failed (likely rate-limited). Keeping existing trophies.svg if present, skipping update this run."
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f trophies.svg ]; then
            git add trophies.svg
            git diff --quiet && git diff --staged --quiet || git commit -m "Update trophies.svg"
            git push
          else
            echo "No trophies.svg to commit."
          fi
