<svg width="900" height="150" viewBox="0 0 900 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd76a"/>
      <stop offset="100%" stop-color="#ff9d4d"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="898" height="148" rx="14" fill="url(#bgT)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Trophy 1 -->
  <g transform="translate(30,30)">
    <text x="0" y="20" font-size="26">🏆</text>
    <text x="40" y="18" font-family="Segoe UI, Verdana, sans-serif" font-size="14" font-weight="700" fill="url(#gold)">Problem Solver</text>
    <text x="0" y="45" font-family="Segoe UI, Verdana, sans-serif" font-size="11" fill="#8b949e">Consistent DSA &amp; LeetCode practice</text>
  </g>

  <line x1="180" y1="20" x2="180" y2="130" stroke="#30363d" stroke-width="1"/>

  <!-- Trophy 2 -->
  <g transform="translate(210,30)">
    <text x="0" y="20" font-size="26">🧠</text>
    <text x="40" y="18" font-family="Segoe UI, Verdana, sans-serif" font-size="14" font-weight="700" fill="url(#gold)">AI / ML Builder</text>
    <text x="0" y="45" font-family="Segoe UI, Verdana, sans-serif" font-size="11" fill="#8b949e">Deployed real ML projects end-to-end</text>
  </g>

  <line x1="380" y1="20" x2="380" y2="130" stroke="#30363d" stroke-width="1"/>

  <!-- Trophy 3 -->
  <g transform="translate(410,30)">
    <text x="0" y="20" font-size="26">⚡</text>
    <text x="40" y="18" font-family="Segoe UI, Verdana, sans-serif" font-size="14" font-weight="700" fill="url(#gold)">Multi-Language</text>
    <text x="0" y="45" font-family="Segoe UI, Verdana, sans-serif" font-size="11" fill="#8b949e">Python, JS, TypeScript, C++, Java</text>
  </g>

  <line x1="580" y1="20" x2="580" y2="130" stroke="#30363d" stroke-width="1"/>

  <!-- Trophy 4 -->
  <g transform="translate(610,30)">
    <text x="0" y="20" font-size="26">🔥</text>
    <text x="40" y="18" font-family="Segoe UI, Verdana, sans-serif" font-size="14" font-weight="700" fill="url(#gold)">Consistent Builder</text>
    <text x="0" y="45" font-family="Segoe UI, Verdana, sans-serif" font-size="11" fill="#8b949e">Active contributions &amp; shipped repos</text>
  </g>

  <line x1="800" y1="20" x2="800" y2="130" stroke="#30363d" stroke-width="1"/>

  <!-- Star accents -->
  <g transform="translate(30,95)">
    <text x="0" y="20" font-size="20">🚀</text>
    <text x="30" y="18" font-family="Segoe UI, Verdana, sans-serif" font-size="12" fill="#8b949e">Open to SDE / AI-ML opportunities</text>
  </g>

</svg>
